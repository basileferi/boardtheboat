framework:
    messenger:
        failure_transport: failed

        transports:
            # Everything slow (imports, career-page validation, enrichment, mails).
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 3
                    max_delay: 900000
            # "scheduler_default" is NOT declared here: symfony/scheduler creates it from
            # App\Schedule (schedule://default). declaring it by hand used to replace it with an
            # empty doctrine queue, so the nightly pipeline never fired.
            failed: 'doctrine://default?queue_name=failed'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            App\Message\RefreshSourcesMessage: async
            App\Message\RunPipelineMessage: async
            App\Message\EnrichCompanyMessage: async

when@prod:
    framework:
        messenger:
            transports:
                sync: 'sync://'
            routing:
                # on shared hosting the worker only runs every 15 minutes: a password-reset
                # mail cannot wait that long, so mails go out during the request in prod.
                Symfony\Component\Mailer\Messenger\SendEmailMessage: sync

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                scheduler_default: 'in-memory://'
                failed: 'in-memory://'
                sync: 'sync://'
            routing:
                # Mails are sent inline under test, so a test can assert on the message itself
                # instead of also having to run a worker.
                Symfony\Component\Mailer\Messenger\SendEmailMessage: sync
